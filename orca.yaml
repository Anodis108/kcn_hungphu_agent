# Orca worktree bootstrap — chạy khi tạo workspace con (worktree create).
# setupRunPolicy skip-by-default: không mở Terminal setup trừ khi bạn chọn Run trong UI.
scripts:
  setup: |
      set -euo pipefail
      if [ ! -d .venv ]; then
        python3 -m venv .venv
      fi
      # shellcheck disable=SC1091
      . .venv/bin/activate
      python -m pip install -q -U pip
      if [ -f requirements.txt ]; then
        pip install -q -r requirements.txt
      fi
      echo "orca setup: ok (.venv ready)"

setupRunPolicy: skip-by-default