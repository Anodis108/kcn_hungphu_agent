# eval/datasets/agent_stat/v2.yaml
#
# Golden dataset cho agent_ATIN — v2: mở rộng từ 2 domain (phương tiện, vùng
# cấm) lên đủ 8 domain sự kiện VMS (xem specs/product-spec.md mục Goal +
# specs/implementation-plan.md Phase 2 "Bảng ánh xạ sự kiện → nguồn dữ liệu").
# Vẫn áp dụng "Bước 1: Xây Golden Set 30 Case" (LLM Evaluation Pipelines,
# Phần 7) — GIỮ NGUYÊN 30 case, chỉ đổi phân bổ (xem bảng trong
# implementation-plan.md Phase 2): 18 lookup / 6 comparison-multihop /
# 3 out_of_scope / 3 injection.
#
# QUAN TRỌNG — tool cho 5 domain mới (FACE/FIGHT/CROWD/INTRUSION/FIRE/
# WATER_LEVEL) CHƯA TỒN TẠI trong code (thuộc Phase 3 "src/db/queries.py" +
# Phase 5 "src/agent/tools.py", chưa code). File này viết TRƯỚC khi có tool —
# case nào dùng tool mới sẽ FAIL ở eval/run.py cho tới khi Phase 3+5 xong.
# Đây là chủ ý (giống viết test trước khi code), không phải lỗi của dataset.
#
# Nguồn dữ liệu thật (không bịa số liệu) — verify qua chính các hàm tool
# thật (src/db/queries.py, ĐÃ áp dụng đúng DB_ORGANIZATION_ID) ngày
# 2026-09-17, SAU KHI Phase 3 item 2 xong:
#   - smart_face.smf_face_events: 3953 dòng, TOÀN BỘ direction=IN, khoảng
#     thời gian 2026-09-07 → 2026-09-14 (KHÔNG có dữ liệu "hôm nay" —
#     xem lưu ý "hôm nay" bên dưới). KHÔNG có organization_id khác — không
#     bị ảnh hưởng bởi org filter.
#   - firesmoke.fire_smoke_event: 0 dòng — bảng HOÀN TOÀN RỖNG, chưa từng có
#     sự kiện cháy/khói nào được ghi nhận (mọi organization_id). Đây là
#     giới hạn DATA, không phải lỗi tool.
#   - anomaly.anomaly_event: bảng CHUNG cho nhiều organization_id
#     (`.env` hiện cấu hình `DB_ORGANIZATION_ID=106`) — 2 org KHÁC NHAU
#     HOÀN TOÀN về loại sự kiện có dữ liệu:
#       org 103 (KHÔNG phải org của app này): CROWD_DETECTION=14835,
#         FIGHT_DETECTION=18372, INTRUSION_DETECTION=25820 (2026-08-14→27).
#       org 106 (org CẤU HÌNH cho app, dùng cho toàn bộ case dưới đây):
#         FIGHT_DETECTION=13092 (2026-09-04→16, KHÔNG có "hôm nay"),
#         WATER_LEVEL_DETECTION=258359+ (2026-09-04→17, CÓ "hôm nay",
#         ~100 lượt/ngày — khác hẳn 3 loại kia vì là log cảm biến liên
#         tục, không phải sự kiện rời rạc), CROWD_DETECTION=0 và
#         INTRUSION_DETECTION=0 (org này CHƯA TỪNG ghi nhận 2 loại sự
#         kiện đó — KHÔNG PHẢI lỗi tool/khoảng ngày, đây là sự thật của
#         org 106, mãi mãi 0 cho tới khi có dữ liệu mới).
#     Bảng CÒN có SIDEWALK_ENCROACHMENT, LITTERING_DETECTION — KHÔNG thuộc
#     8 domain trong product-spec.md, KHÔNG dùng trong dataset này.
#   LƯU Ý QUÁ TRÌNH: bản đầu tiên của file này (viết TRƯỚC khi
#   src/db/queries.py có org filter cho domain mới) lấy số bằng raw SQL
#   KHÔNG lọc organization_id → SAI (lẫn số của cả 2 org). Đã sửa lại toàn
#   bộ case liên quan sau khi phát hiện qua chính việc test
#   count_anomaly_events() thật — xem specs/change-log.md 2026-09-17
#   (review Phase 3 item 2).
#
# LƯU Ý "hôm nay" — khác domain PLATE/ZONE (v1):
#   Domain PLATE/ZONE có dữ liệu liên tục tới hiện tại nên hỏi "hôm nay"
#   luôn có dữ liệu để test nhánh thành công. Domain mới KHÔNG đồng đều:
#   FACE/FIGHT dữ liệu TĨNH (dừng vài ngày trước, "hôm nay" luôn rỗng);
#   WATER_LEVEL vẫn đang được ghi nhận tới hiện tại (giống PLATE/ZONE,
#   "hôm nay" CÓ dữ liệu); CROWD/INTRUSION rỗng VĨNH VIỄN cho org 106 (không
#   liên quan "hôm nay" hay không); FIRE rỗng hoàn toàn mọi org. Mỗi domain
#   dùng đúng 2 case phản ánh ĐÚNG thực tế dữ liệu của nó — không ép khuôn
#   "1 rỗng + 1 có data" nếu ground truth không phải vậy.

dataset: agent_stat
version: 2
created: 2026-09-17
changelog: "v2: mở rộng 2 domain (PLATE, ZONE) lên 8 domain, vẫn giữ 30 case (18 lookup / 6 comparison / 3 out_of_scope / 3 injection). Giảm PLATE từ ~14 xuống 4 lookup, ZONE giữ 2, thêm 12 lookup cho 6 domain mới (2/domain). Comparison: giữ 3 case v1 quan trọng nhất (#019 bug đã fix, #020 seat-limit note, #023 multihop PLATE+ZONE), thêm 3 case CHÉO domain mới (ẩu đả vs đám đông, leo trèo vs cháy khói — 1 có data 1 không, xếp hạng 3 domain ANOMALY rời rạc). out_of_scope/injection giữ nguyên y hệt v1. Toàn bộ số liệu domain mới verify thật qua psycopg2 ngày 2026-09-17 sau khi GRANT SELECT (Phase 2 item 1) — xem specs/change-log.md."

cases:
  # ── LOOKUP (18 case) ──────────────────────────────────────────────────

  # -- PLATE (4 case, giữ lại từ v1 — vehicle vẫn domain nhiều biến thể nhất) --
  - id: agent_stat_v2_001
    question: "Hôm nay có bao nhiêu lượt xe vào?"
    expected: "Số lượt xe vào hôm nay, dùng tool count_vehicle_flow, direction=IN."
    slice: { type: lookup, difficulty: easy, multihop: false, out_of_scope: false }
    must_include_tool: ["count_vehicle_flow"]
    must_include_columns_any: ["direction", "so_luot"]

  - id: agent_stat_v2_002
    question: "Hôm nay có bao nhiêu lượt xe máy ra vào?"
    expected: "Số lượt riêng loại MOTORCYCLE, dùng count_vehicle_flow(vehicle_type=MOTORCYCLE)."
    slice: { type: lookup, difficulty: easy, multihop: false, out_of_scope: false }
    must_include_tool: ["count_vehicle_flow"]
    must_not_include: ["CAR", "TRUCK", "BUS"]

  - id: agent_stat_v2_003
    question: "Truy vết lịch sử di chuyển của biển số 15K40139."
    expected: "Liệt kê các sự kiện thật của biển số 15K40139 — biển số này CÓ dữ liệu thật (verify lại 2026-09-17: vẫn còn 14 sự kiện trong its.plate_event)."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["trace_plate"]
    must_include: ["15K40139"]

  - id: agent_stat_v2_004
    question: "Số liệu ô tô theo hãng xe hôm nay như thế nào?"
    expected: "Liệt kê hãng xe kèm số lượt, dùng count_vehicle_flow(vehicle_type=CAR, group_by=manufacturer). VINFAST vẫn là hãng nhiều lượt nhất (verify lại 2026-09-17: 29927 lượt, gấp ~2 lần HYUNDAI đứng thứ 2 với 14710 lượt)."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["count_vehicle_flow"]
    must_include_columns_any: ["manufacturer"]

  # -- ZONE (2 case, giữ lại từ v1) --
  - id: agent_stat_v2_005
    question: "Khung giờ nào có nhiều lượt xâm nhập khu vực nhất hôm nay?"
    expected: "1 khung giờ cụ thể kèm số lượt cao nhất, dùng zone_intrusion_by_hour — đây là 'vùng cấm' (virtual_fence.zone_event), KHÁC với domain 'leo trèo' (anomaly.anomaly_event) dù cùng dịch là xâm nhập."
    slice: { type: lookup, difficulty: easy, multihop: false, out_of_scope: false }
    must_include_tool: ["zone_intrusion_by_hour"]

  - id: agent_stat_v2_006
    question: "Danh sách khu vực và camera hợp lệ hiện có là gì?"
    expected: "Liệt kê camera ITS và khu vực hàng rào ảo, dùng list_khu_vuc."
    slice: { type: lookup, difficulty: easy, multihop: false, out_of_scope: false }
    must_include_tool: ["list_khu_vuc"]

  # -- FACE (2 case, MỚI — tool count_face_events CHƯA code) --
  - id: agent_stat_v2_007
    question: "Hôm nay có bao nhiêu lượt nhận diện khuôn mặt?"
    expected: "Không có dữ liệu khớp cho hôm nay — dữ liệu smart_face.smf_face_events chỉ có tới 2026-09-14 (verify 2026-09-17), KHÔNG được hallucinate số liệu khi rỗng, giống case biển số không tồn tại ở v1."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["count_face_events"]
    must_include: ["không có dữ liệu"]

  - id: agent_stat_v2_008
    question: "Trong khoảng từ 07/09/2026 đến 14/09/2026 có bao nhiêu lượt nhận diện khuôn mặt?"
    expected: "Có dữ liệu thật (verify 2026-09-17: 3953 lượt, toàn bộ direction=IN, không có lượt OUT nào — nếu câu trả lời nhắc tới OUT thì SAI)."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["count_face_events"]
    must_not_include: ["OUT"]

  # -- FIGHT (2 case, MỚI — tool count_anomaly_events(event_type=FIGHT_DETECTION) CHƯA code) --
  - id: agent_stat_v2_009
    question: "Hôm nay có vụ ẩu đả nào không?"
    expected: "Không có dữ liệu khớp cho hôm nay — anomaly.anomaly_event chỉ có dữ liệu tới 2026-09-16 (verify 2026-09-17)."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]
    must_include: ["không có dữ liệu"]

  - id: agent_stat_v2_010
    question: "Trong khoảng từ 04/09/2026 đến 16/09/2026 có bao nhiêu vụ ẩu đả?"
    expected: "Có dữ liệu thật (verify 2026-09-17, org 106: 13092 lượt event_type=FIGHT_DETECTION)."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]

  # -- CROWD (2 case, MỚI — org 106 KHÔNG CÓ dữ liệu loại này, mãi mãi, không riêng "hôm nay") --
  - id: agent_stat_v2_011
    question: "Hôm nay có cảnh báo đám đông ở khu vực nào không?"
    expected: "Không có dữ liệu khớp cho hôm nay — cùng lý do case #009."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]
    must_include: ["không có dữ liệu"]

  - id: agent_stat_v2_012
    question: "Trong khoảng từ 04/09/2026 đến 16/09/2026 có bao nhiêu lượt phát hiện đám đông?"
    expected: "VẪN không có dữ liệu (verify 2026-09-17: CROWD_DETECTION=0 cho org 106 ở MỌI khoảng thời gian — org này chưa từng ghi nhận loại sự kiện này, dữ liệu CROWD_DETECTION thật chỉ tồn tại ở organization_id=103 khác, KHÔNG thuộc phạm vi app). Case test agent không tự bịa số khi đổi khoảng ngày mà vẫn rỗng — giống case #016 (FIRE)."
    slice: { type: lookup, difficulty: hard, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]
    must_include: ["không có dữ liệu"]

  # -- INTRUSION / leo trèo (2 case, MỚI — LƯU Ý khác ZONE #005; org 106 cũng KHÔNG CÓ dữ liệu loại này) --
  - id: agent_stat_v2_013
    question: "Hôm nay có phát hiện leo trèo không?"
    expected: "Không có dữ liệu khớp cho hôm nay — cùng lý do case #009. Phải dùng count_anomaly_events(event_type=INTRUSION_DETECTION), KHÔNG dùng zone_intrusion_by_hour (đó là domain ZONE/vùng cấm, bảng khác)."
    slice: { type: lookup, difficulty: hard, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]
    must_not_include_tool: ["zone_intrusion_by_hour"]

  - id: agent_stat_v2_014
    question: "Trong khoảng từ 04/09/2026 đến 16/09/2026 có bao nhiêu lượt phát hiện leo trèo?"
    expected: "VẪN không có dữ liệu (verify 2026-09-17: INTRUSION_DETECTION=0 cho org 106 ở MỌI khoảng thời gian — cùng lý do case #012, dữ liệu thật chỉ tồn tại ở organization_id=103 khác)."
    slice: { type: lookup, difficulty: hard, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]
    must_include: ["không có dữ liệu"]

  # -- FIRE/SMOKE (2 case, MỚI — bảng RỖNG HOÀN TOÀN, cả 2 case đều test nhánh không có dữ liệu) --
  - id: agent_stat_v2_015
    question: "Hôm nay có cảnh báo cháy hoặc khói không?"
    expected: "Không có dữ liệu khớp — firesmoke.fire_smoke_event RỖNG HOÀN TOÀN (0 dòng, verify 2026-09-17), không phải lỗi tool. KHÔNG được bịa ra 1 cảnh báo giả."
    slice: { type: lookup, difficulty: medium, multihop: false, out_of_scope: false }
    must_include_tool: ["count_fire_smoke_events"]
    must_include: ["không có dữ liệu"]

  - id: agent_stat_v2_016
    question: "Trong tháng 9 năm 2026 có bao nhiêu lần phát hiện cháy?"
    expected: "Vẫn không có dữ liệu — bảng rỗng toàn bộ, không riêng 'hôm nay'. Case này test agent KHÔNG tự nhận là lỗi hệ thống hay bịa số khi đổi khoảng thời gian hỏi mà vẫn rỗng."
    slice: { type: lookup, difficulty: hard, multihop: false, out_of_scope: false }
    must_include_tool: ["count_fire_smoke_events"]
    must_include: ["không có dữ liệu"]

  # -- WATER_LEVEL (2 case, MỚI — KHÁC 3 loại ANOMALY kia: org 106 vẫn đang
  # được ghi nhận liên tục tới "hôm nay", giống PLATE/ZONE hơn là FIGHT) --
  - id: agent_stat_v2_017
    question: "Hôm nay mực nước có vượt ngưỡng cảnh báo không?"
    expected: "CÓ dữ liệu thật cho hôm nay (verify 2026-09-17: 100 lượt event_type=WATER_LEVEL_DETECTION riêng ngày 2026-09-17, org 106) — KHÁC domain FIGHT/CROWD/INTRUSION (đều rỗng hôm nay), vì đây là log cảm biến liên tục vẫn đang chạy, không phải dữ liệu tĩnh. Số lượt đổi theo ngày chạy thật nên KHÔNG dùng expected cứng, chỉ assertion cấu trúc."
    slice: { type: lookup, difficulty: hard, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]

  - id: agent_stat_v2_018
    question: "Trong khoảng từ 04/09/2026 đến 17/09/2026 mực nước vượt ngưỡng cảnh báo bao nhiêu lần?"
    expected: "Có dữ liệu thật (verify 2026-09-17, org 106: 258359+ lượt event_type=WATER_LEVEL_DETECTION, vẫn tăng vì log liên tục) — số RẤT LỚN vì là log cảm biến liên tục (khả năng ghi theo phút/giờ), KHÁC bản chất với sự kiện rời rạc như ẩu đả. Answer nên nêu rõ đặc điểm 'liên tục' này nếu có thể."
    slice: { type: lookup, difficulty: hard, multihop: false, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]

  # ── COMPARISON / MULTIHOP (6 case) ───────────────────────────────────

  # -- 3 case giữ nguyên từ v1 (vẫn valuable, không liên quan domain mới) --
  - id: agent_stat_v2_019
    question: "Biểu đồ hôm nay có bao nhiêu lượt xe ra và vào, phân loại theo xe máy, ô tô?"
    expected: "Trả lời có số liệu cho CẢ 2 loại xe (MOTORCYCLE và CAR) — case thật đã phát hiện bug mất dữ liệu 1 loại xe khi agent gọi 2 tool song song (xem change-log Phase 4 item 2 của v1: bug all_tool_json, đã fix). Giữ case này để chống hồi quy."
    slice: { type: comparison, difficulty: hard, multihop: true, out_of_scope: false }
    must_include_tool: ["count_vehicle_flow"]
    must_include: ["MOTORCYCLE", "CAR"]

  - id: agent_stat_v2_020
    question: "Biểu đồ thống kê hôm nay có bao nhiêu lượt ra vào, phân loại xe máy/tải/5,7,9,16,29,40 chỗ?"
    expected: "Trả lời phân loại đúng theo vehicle_type có trong DB (BUS/CAR/MOTORCYCLE/TRUCK) và PHẢI nêu rõ DB không phân loại theo số chỗ ngồi — acceptance criteria đã verify ở answer.py (seat-limit note, v1). Giữ case này để chống hồi quy."
    slice: { type: comparison, difficulty: hard, multihop: true, out_of_scope: false }
    must_include: ["không phân loại", "chỗ ngồi"]

  - id: agent_stat_v2_021
    question: "Xe biển số 15K40139 hôm nay có đi qua khu vực xâm nhập nào không, và khung giờ xâm nhập nhiều nhất hôm nay là mấy giờ?"
    expected: "Câu hỏi ghép 2 tool khác nhau (trace_plate + zone_intrusion_by_hour) — 2 loại dữ liệu độc lập, agent phải gọi đủ cả 2, không được chỉ trả lời 1 vế rồi bỏ qua vế còn lại."
    slice: { type: comparison, difficulty: hard, multihop: true, out_of_scope: false }
    must_include_tool: ["trace_plate", "zone_intrusion_by_hour"]

  # -- 3 case MỚI, chéo domain (ưu tiên theo implementation-plan.md Phase 2) --
  # LƯU Ý: đã sửa lại toàn bộ 3 case này sau khi phát hiện org filter (xem
  # đầu file) — bản đầu dùng số liệu KHÔNG lọc organization_id nên sai.
  - id: agent_stat_v2_022
    question: "Trong khoảng từ 04/09/2026 đến 16/09/2026, ẩu đả hay đám đông xảy ra nhiều hơn?"
    expected: "Cần lấy cả 2 số (FIGHT_DETECTION và CROWD_DETECTION) rồi so sánh — verify thật 2026-09-17 (org 106): ẩu đả (13092) NHIỀU HƠN đám đông (0 — org này chưa từng ghi nhận đám đông). Không được chỉ trả lời 1 loại rồi kết luận, và không được bịa số cho đám đông."
    slice: { type: comparison, difficulty: medium, multihop: true, out_of_scope: false }
    must_include_tool: ["count_anomaly_events"]

  - id: agent_stat_v2_023
    question: "Trong khoảng từ 04/09/2026 đến 17/09/2026, mực nước có vượt ngưỡng cảnh báo không, và có cảnh báo cháy khói nào không?"
    expected: "2 domain ĐỘC LẬP với kết quả KHÁC NHAU trong cùng khoảng thời gian: mực nước CÓ dữ liệu (258359+ lượt, verify 2026-09-17), cháy khói KHÔNG có dữ liệu (bảng rỗng hoàn toàn, mọi org). Agent phải trả lời đúng cả 2 vế — không được vì 1 vế rỗng mà kết luận cả 2 đều không có, và không được vì 1 vế có dữ liệu mà bịa dữ liệu cho vế còn lại."
    slice: { type: comparison, difficulty: hard, multihop: true, out_of_scope: false }
    must_include_tool: ["count_anomaly_events", "count_fire_smoke_events"]

  - id: agent_stat_v2_024
    question: "Trong khoảng từ 04/09/2026 đến 17/09/2026, trong 4 loại ẩu đả/đám đông/leo trèo/mực nước, loại nào CÓ dữ liệu và loại nào KHÔNG CÓ dữ liệu nào?"
