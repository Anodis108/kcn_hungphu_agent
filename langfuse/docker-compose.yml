# Compatibility shim — nguồn sự thật ở repo root:
#   docker compose -f docker-compose.observability.yml --env-file langfuse/.env up -d
#   docker compose -f docker-compose.observability.yml --env-file langfuse/.env down
#
# `cd langfuse && docker compose up -d` vẫn chạy được (include file gốc).

name: kcn-hungphu-obs

include:
  - path: ../docker-compose.observability.yml
