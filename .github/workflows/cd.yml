name: cd

# Phase 21.4 — Continuous Delivery (Local runner verification & Registry push)
#
# Nguyên tắc:
# 1. Chỉ chạy khi CI xanh (workflow_run [CI] completed main) hoặc kích hoạt thủ công (workflow_dispatch).
# 2. Concurrency không cancel-in-progress để tránh huỷ giữa chừng gây hỏng trạng thái deploy.
# 3. Checkout đúng commit SHA mà CI đã test (workflow_run.head_sha).
# 4. Local verification trên runner: Docker build tag=SHA bất biến, docker run, chạy deploy/smoke.py.
# 5. Dump container logs khi smoke failure.
# 6. Push GitHub Container Registry (ghcr.io) được gate qua vars.ENABLE_REGISTRY_PUSH == 'true' (mặc định skip).
# 7. Ghi Job Summary với SHA và kết quả smoke test.

'on':
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: chatkcn

jobs:
  cd-local:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve Git SHA
        id: vars
        run: |
          SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies for smoke test
        run: pip install httpx

      - name: Build Docker image (tag = git SHA)
        run: |
          docker build -t chatkcn:${{ steps.vars.outputs.sha }} -t chatkcn:latest .

      - name: Require OPENAI_API_KEYS secret for CD smoke
        # Demo eval-gate cũng lấy key từ secrets; CI unit vẫn hermetic (không key).
        # Runner GitHub không có Postgres/Qdrant host → MEMORY off + DB trống (giống ranh giới hermetic deps).
        # Local thật: ./deploy/release.sh + .env (DOCKER_NETWORK=host).
        env:
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
        run: |
          if [ -z "${OPENAI_API_KEYS}" ]; then
            echo "::error::Set repository secret OPENAI_API_KEYS for CD local smoke (same as demo eval-gate)."
            exit 1
          fi

      - name: Run container for smoke (real LLM key, no host DB on runner)
        env:
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
        run: |
          docker run -d \
            --name chatkcn-app \
            -p 8000:8000 \
            -e DB_HOST="" \
            -e AGENT_DB_HOST="" \
            -e IAM_REQUIRED="false" \
            -e MEMORY_ENABLED="false" \
            -e LLM_BACKEND="openai" \
            -e OPENAI_API_KEYS \
            chatkcn:${{ steps.vars.outputs.sha }}

      - name: Wait for backend readiness
        run: |
          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8000/ready >/dev/null 2>&1; then
              echo "Backend is up and ready on attempt $i"
              break
            fi
            sleep 2
          done

      - name: Run smoke test
        id: smoke
        run: |
          python deploy/smoke.py --url http://127.0.0.1:8000 | tee smoke.log

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== Container Logs (chatkcn-app) ==="
          docker logs --tail 200 chatkcn-app || true

      - name: Cleanup local container
        if: always()
        run: |
          docker rm -f chatkcn-app >/dev/null 2>&1 || true

      - name: Log in to GitHub Container Registry
        if: vars.ENABLE_REGISTRY_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to ghcr.io
        if: vars.ENABLE_REGISTRY_PUSH == 'true'
        run: |
          GHCR_IMAGE="ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}"
          docker tag chatkcn:${{ steps.vars.outputs.sha }} "$GHCR_IMAGE"
          docker tag chatkcn:${{ steps.vars.outputs.sha }} "ghcr.io/${{ github.repository }}:latest"
          docker push "$GHCR_IMAGE"
          docker push "ghcr.io/${{ github.repository }}:latest"

      - name: Write Job Summary
        if: always()
        run: |
          echo "### CD Local Runner Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA**: \`${{ steps.vars.outputs.full_sha }}\` (\`${{ steps.vars.outputs.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image Tag**: \`chatkcn:${{ steps.vars.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "- **Smoke Status**: ✅ PASS (/api/health 200, /ready 200)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Smoke Status**: ❌ FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f smoke.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Smoke Log Output</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat smoke.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi
