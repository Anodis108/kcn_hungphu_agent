<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent_ATIN — Thống kê xe ra/vào &amp; xâm nhập khu vực</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 1.3rem; }
  #log { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; }
  .bot { align-self: flex-start; background: #1e293b; }
  .bot.error { background: #7f1d1d; }
  .bot.pending { background: #1e293b; color: #94a3b8; font-style: italic; }
  .meta { font-family: monospace; font-size: 0.75rem; color: #94a3b8; margin-top: 6px; }
  table { border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
  td, th { border: 1px solid #334155; padding: 3px 8px; text-align: left; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { color: #94a3b8; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>agent_ATIN — Thống kê xe ra/vào &amp; xâm nhập khu vực</h1>
  <p class="hint">VD: "Hôm nay có bao nhiêu lượt xe ra vào, phân loại xe máy/ô tô?" ·
    "Số liệu ô tô theo hãng xe hôm nay" · "Truy vết biển số XXXX" ·
    "Khung giờ xâm nhập nhiều nhất hôm nay"</p>
  <div id="log"></div>
  <form id="ask-form">
    <input id="question" placeholder="Nhập câu hỏi thống kê..." required />
    <button type="submit">Hỏi</button>
  </form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const button = form.querySelector("button");

function addMsg(text, cls, data) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (data && data.row_count) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `tool: ${data.tool} · ${data.row_count} dòng`;
    div.appendChild(meta);
    if (data.rows && data.rows.length) {
      const table = document.createElement("table");
      const head = document.createElement("tr");
      data.columns.forEach((c) => {
        const th = document.createElement("th");
        th.textContent = c;
        head.appendChild(th);
      });
      table.appendChild(head);
      data.rows.slice(0, 20).forEach((row) => {
        const tr = document.createElement("tr");
        row.forEach((v) => {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      div.appendChild(table);
    }
  }
  log.appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMsg(question, "user");
  input.value = "";
  button.disabled = true;
  input.disabled = true;
  const pending = addMsg("Đang xử lý...", "bot pending");
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    pending.remove();
    if (!res.ok) {
      const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
      addMsg("Lỗi: " + (detail || res.statusText), "bot error");
      return;
    }
    addMsg(data.answer, "bot", data);
  } catch (err) {
    pending.remove();
    addMsg("Lỗi kết nối: " + err, "bot error");
  } finally {
    button.disabled = false;
    input.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
